version: '3.8'

services:
  backend:
    container_name: devops_auth_service_backend
    build:
      context: .
      dockerfile: Dockerfile  
    environment:
      - ConnectionStrings__Database=Host=db;Port=5432;Database=devops_authservice;Username=postgres;Password=postgres
      - ConnectionStrings__TestsDatabase=Host=db;Port=5432;Database=devops_authservice_tests;Username=postgres;Password=postgres
    ports:
      - "5128:8080"
    depends_on:
      - db

  client:
    container_name: devops_auth_service_client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5001:4173"
    depends_on:
      - backend
        
  nginx:
    container_name: devops_auth_service_nginx
    image: nginx:mainline
    ports:
      - "80:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf"
    depends_on:
      - client

  db:
    container_name: devops_auth_service_database 
    image: postgres:latest
    ports: 
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:    