# PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: devops-auth
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# Backend
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: devops-auth
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
---
# Frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: devops-auth
spec:
  selector:
    app: frontend
  ports:
  - port: 4173
    targetPort: 4173
---
# Nginx
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: devops-auth
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000